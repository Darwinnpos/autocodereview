{% extends "base.html" %}

{% block title %}AutoCodeReview - 审核历史{% endblock %}

{% block content %}
<!-- 统计概览卡片区 -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h5 class="card-title">审查次数</h5>
                        <h2 id="totalReviews">-</h2>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-file-earmark-code-fill fs-1"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h5 class="card-title">成功率</h5>
                        <h2 id="successRate">-%</h2>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-check-circle-fill fs-1"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h5 class="card-title">发现问题</h5>
                        <h2 id="totalIssues">-</h2>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-bug-fill fs-1"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h5 class="card-title">评论发布</h5>
                        <h2 id="commentsPosted">-</h2>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-chat-dots-fill fs-1"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="row">
    <!-- 审查历史表格 - 现在占用全宽度 -->
    <div class="col-12">
        <!-- 审查记录列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="bi bi-list-ul"></i>
                    审查历史
                    <span class="badge bg-secondary ms-2" id="totalRecordsCount">0</span>
                </h5>
                <div>
                    <button class="btn btn-outline-secondary btn-sm" id="exportBtn" disabled>
                        <i class="bi bi-download"></i> 导出
                    </button>
                    <button class="btn btn-outline-success btn-sm" id="refreshBtn">
                        <i class="bi bi-arrow-clockwise"></i> 刷新
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <!-- 加载状态 -->
                <div id="loadingIndicator" class="text-center p-4">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <div class="mt-2">正在加载审查记录...</div>
                </div>

                <!-- 空状态 -->
                <div id="emptyState" class="text-center p-5" style="display: none;">
                    <i class="bi bi-inbox display-1 text-muted"></i>
                    <h5 class="mt-3 text-muted">暂无审查记录</h5>
                    <p class="text-muted">开始您的第一次代码审查吧！</p>
                    <a href="/" class="btn btn-primary">
                        <i class="bi bi-play"></i> 开始审查
                    </a>
                </div>

                <!-- 记录表格 -->
                <div id="reviewsTable" style="display: none;">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th width="5%" class="text-center">#</th>
                                    <th width="18%">项目信息</th>
                                    <th width="22%">MR信息</th>
                                    <th width="13%">分析结果</th>
                                    <th width="10%" class="text-center">评论</th>
                                    <th width="12%">状态</th>
                                    <th width="12%">时间</th>
                                    <th width="8%" class="text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="reviewsTableBody">
                                <!-- 动态生成的审查记录行 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 分页导航 -->
                    <div class="card-footer">
                        <nav aria-label="审查记录分页">
                            <ul class="pagination pagination-sm justify-content-center mb-0" id="pagination">
                                <!-- 分页按钮动态生成 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>




    </div>
</div>

<!-- 详情模态框 -->
<div class="modal fade" id="reviewDetailModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-file-text"></i>
                    审查详情
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="reviewDetailContent" style="max-height: 70vh; overflow-y: auto;">
                <!-- 详情内容动态加载 -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 代码上下文模态框 -->
<div class="modal fade" id="codeContextModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-code-square"></i>
                    代码上下文
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="codeContextContent">
                <!-- 代码上下文动态加载 -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 审查历史管理器
class ReviewHistoryManager {
    constructor() {
        this.currentPage = 1;
        this.pageSize = 10;
        this.totalPages = 0;
        this.totalRecords = 0;
    }

    async init() {
        this.initEventListeners();
        await this.loadAll();
    }

    initEventListeners() {
        // 只绑定存在的刷新按钮
        document.getElementById('refreshBtn').addEventListener('click', () => {
            this.loadAll();
        });
    }

    async loadAll() {
        await Promise.all([
            this.loadStatistics(),
            this.loadReviews()
        ]);
    }

    async loadStatistics() {
        try {
            const response = await axios.get('/api/history/statistics');

            if (response.data.success) {
                this.updateStatisticsCards(response.data.data);
            } else {
                console.error('Statistics API returned error:', response.data.error);
            }
        } catch (error) {
            console.error('Failed to load statistics:', error);
        }
    }

    async loadReviews() {
        try {
            this.showLoadingState();

            const params = {
                page: this.currentPage,
                limit: this.pageSize
            };

            const response = await axios.get('/api/history/reviews', { params });

            if (response.data.success) {
                const data = response.data.data;
                this.totalRecords = data.total;
                this.totalPages = Math.ceil(data.total / this.pageSize);

                if (data.reviews.length === 0 && this.currentPage === 1) {
                    this.showEmptyState();
                } else {
                    this.renderReviewsTable(data.reviews);
                    this.updatePagination();
                    this.showTableState();
                }

                document.getElementById('totalRecordsCount').textContent = data.total;
            } else {
                console.error('API returned error:', response.data.error);
                this.showErrorState();
            }
        } catch (error) {
            console.error('Failed to load reviews:', error);
            this.showErrorState();
        }
    }



    updateStatisticsCards(stats) {
        document.getElementById('totalReviews').textContent = stats.total_reviews || 0;
        document.getElementById('successRate').textContent = (stats.success_rate || 0) + '%';
        document.getElementById('totalIssues').textContent = stats.total_issues || 0;
        document.getElementById('commentsPosted').textContent = stats.comments_posted || 0;
    }

    renderReviewsTable(reviews) {
        const tbody = document.getElementById('reviewsTableBody');
        tbody.innerHTML = '';

        reviews.forEach((review, index) => {
            const row = this.createReviewRow(review, (this.currentPage - 1) * this.pageSize + index + 1);
            tbody.appendChild(row);
        });
    }

    createReviewRow(review, rowNumber) {
        const tr = document.createElement('tr');
        tr.className = 'review-row';
        tr.style.cursor = 'pointer';

        // 状态样式映射
        const statusMap = {
            'completed': { class: 'success', text: '已完成', icon: 'check-circle' },
            'failed': { class: 'danger', text: '失败', icon: 'x-circle' },
            'pending': { class: 'primary', text: '进行中', icon: 'clock' },
            'cancelled': { class: 'secondary', text: '已取消', icon: 'dash-circle' }
        };

        const status = statusMap[review.status] || statusMap['failed'];

        // 格式化时间
        const createdAt = new Date(review.created_at).toLocaleString('zh-CN');
        const completedAt = review.completed_at ?
            new Date(review.completed_at).toLocaleString('zh-CN') : '-';

        // 项目信息
        const projectInfo = review.project_path || '未知项目';
        const projectShort = projectInfo.length > 20 ?
            projectInfo.substring(0, 20) + '...' : projectInfo;

        // MR信息 (增加显示长度)
        const mrTitle = review.mr_title || '未知标题';
        const mrTitleShort = mrTitle.length > 45 ?
            mrTitle.substring(0, 45) + '...' : mrTitle;

        tr.innerHTML = `
            <td class="text-center">${rowNumber}</td>
            <td>
                <div class="small">
                    <strong title="${projectInfo}">${projectShort}</strong><br>
                    <span class="text-muted">ID: ${review.project_id || 'N/A'}</span>
                </div>
            </td>
            <td>
                <div class="small">
                    <strong title="${mrTitle}">${mrTitleShort}</strong><br>
                    <span class="text-muted">!${review.mr_iid || 'N/A'} • ${review.mr_author || 'Unknown'}</span><br>
                    <span class="text-muted">${review.source_branch || 'unknown'} → ${review.target_branch || 'unknown'}</span>
                </div>
            </td>
            <td>
                <div class="small">
                    <div><span class="badge bg-light text-dark">文件: ${review.total_files_analyzed || 0}</span></div>
                    <div class="mt-1"><span class="badge bg-light text-dark">问题: ${review.total_issues_found || 0}</span></div>
                    ${review.total_issues_found > 0 ? `
                        <div class="mt-1">
                            <span class="badge bg-danger">${review.error_count || 0}</span>
                            <span class="badge bg-warning">${review.warning_count || 0}</span>
                            <span class="badge bg-info">${review.info_count || 0}</span>
                        </div>
                    ` : ''}
                </div>
            </td>
            <td class="text-center">
                <span class="badge bg-success">${review.comments_posted || 0}</span>
            </td>
            <td>
                <span class="badge bg-${status.class}">
                    <i class="bi bi-${status.icon}"></i> ${status.text}
                </span>
                ${review.status === 'failed' && review.error_message ? `
                    <br><small class="text-danger" title="${review.error_message}">
                        ${review.error_message.length > 20 ? review.error_message.substring(0, 20) + '...' : review.error_message}
                    </small>
                ` : ''}
            </td>
            <td class="small">
                <div>创建: ${createdAt}</div>
                ${review.completed_at ? `<div class="text-muted">完成: ${completedAt}</div>` : ''}
            </td>
            <td class="text-center">
                <div class="btn-group" role="group">
                    <button class="btn btn-outline-primary btn-sm" onclick="showReviewDetail(${review.id})" title="查看详情">
                        <i class="bi bi-eye"></i>
                    </button>
                    ${review.mr_url ? `
                        <button class="btn btn-outline-info btn-sm" onclick="openMR('${review.mr_url}')" title="查看MR">
                            <i class="bi bi-arrow-up-right-square"></i>
                        </button>
                    ` : ''}
                    ${review.status === 'completed' ? `
                        <button class="btn btn-outline-success btn-sm" onclick="reviewAgain('${review.mr_url}')" title="重新审查">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    ` : ''}
                </div>
            </td>
        `;

        return tr;
    }

    updatePagination() {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        if (this.totalPages <= 1) return;

        // 上一页
        const prevLi = document.createElement('li');
        prevLi.className = `page-item ${this.currentPage === 1 ? 'disabled' : ''}`;
        prevLi.innerHTML = `<a class="page-link" href="#" onclick="historyManager.goToPage(${this.currentPage - 1})">上一页</a>`;
        pagination.appendChild(prevLi);

        // 页码
        const startPage = Math.max(1, this.currentPage - 2);
        const endPage = Math.min(this.totalPages, startPage + 4);

        for (let i = startPage; i <= endPage; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === this.currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#" onclick="historyManager.goToPage(${i})">${i}</a>`;
            pagination.appendChild(li);
        }

        // 下一页
        const nextLi = document.createElement('li');
        nextLi.className = `page-item ${this.currentPage === this.totalPages ? 'disabled' : ''}`;
        nextLi.innerHTML = `<a class="page-link" href="#" onclick="historyManager.goToPage(${this.currentPage + 1})">下一页</a>`;
        pagination.appendChild(nextLi);
    }

    goToPage(page) {
        if (page < 1 || page > this.totalPages) return;
        this.currentPage = page;
        this.loadReviews();
    }

    renderTrendChart(data) {
        const ctx = document.getElementById('reviewTrendChart').getContext('2d');

        if (this.trendChart) {
            this.trendChart.destroy();
        }

        const labels = data.map(item => {
            const date = new Date(item.date);
            return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        });

        const totalData = data.map(item => item.total_count);
        const completedData = data.map(item => item.completed_count);
        const failedData = data.map(item => item.failed_count);

        this.trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '总审查数',
                        data: totalData,
                        borderColor: 'rgb(54, 162, 235)',
                        backgroundColor: 'rgba(54, 162, 235, 0.1)',
                        tension: 0.1
                    },
                    {
                        label: '成功',
                        data: completedData,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.1)',
                        tension: 0.1
                    },
                    {
                        label: '失败',
                        data: failedData,
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.1)',
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });
    }

    showLoadingState() {
        document.getElementById('loadingIndicator').style.display = 'block';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('reviewsTable').style.display = 'none';
    }

    showEmptyState() {
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('reviewsTable').style.display = 'none';
    }

    showTableState() {
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('reviewsTable').style.display = 'block';
    }

    showErrorState() {
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('reviewsTable').style.display = 'none';
        // TODO: 显示错误状态
    }
}

// 全局实例
let historyManager;

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    historyManager = new ReviewHistoryManager();
    historyManager.init();
});

// 全局功能函数
async function showReviewDetail(reviewId) {
    try {
        const response = await axios.get(`/api/history/review/${reviewId}`);
        if (response.data.success) {
            const review = response.data.data;
            renderReviewDetailModal(review);
            const modal = new bootstrap.Modal(document.getElementById('reviewDetailModal'));
            modal.show();
        }
    } catch (error) {
        console.error('Failed to load review detail:', error);
        alert('加载详情失败');
    }
}

function renderReviewDetailModal(review) {
    const content = document.getElementById('reviewDetailContent');

    // 统计pending状态的评论数量
    const issues = review.issues || [];
    const pendingCount = issues.filter(i => i.comment_status === 'pending').length;
    const confirmedCount = issues.filter(i => i.comment_status === 'confirmed').length;
    const rejectedCount = issues.filter(i => i.comment_status === 'rejected').length;
    const postedCount = issues.filter(i => i.comment_status === 'posted').length;

    content.innerHTML = `
        <div class="row">
            <div class="col-md-6">
                <h6>基本信息</h6>
                <table class="table table-sm">
                    <tr><td>项目路径</td><td>${review.project_path || 'N/A'}</td></tr>
                    <tr><td>项目ID</td><td>${review.project_id || 'N/A'}</td></tr>
                    <tr><td>MR ID</td><td>!${review.mr_iid || 'N/A'}</td></tr>
                    <tr><td>MR标题</td><td>${review.mr_title || 'N/A'}</td></tr>
                    <tr><td>MR作者</td><td>${review.mr_author || 'N/A'}</td></tr>
                    <tr><td>源分支</td><td>${review.source_branch || 'N/A'}</td></tr>
                    <tr><td>目标分支</td><td>${review.target_branch || 'N/A'}</td></tr>
                </table>
            </div>
            <div class="col-md-6">
                <h6>分析结果</h6>
                <table class="table table-sm">
                    <tr><td>分析文件数</td><td>${review.total_files_analyzed || 0}</td></tr>
                    <tr><td>发现问题数</td><td>${review.total_issues_found || 0}</td></tr>
                    <tr><td>错误</td><td><span class="badge bg-danger">${review.error_count || 0}</span></td></tr>
                    <tr><td>警告</td><td><span class="badge bg-warning">${review.warning_count || 0}</span></td></tr>
                    <tr><td>建议</td><td><span class="badge bg-info">${review.info_count || 0}</span></td></tr>
                    <tr><td>已发布评论</td><td>${review.comments_posted || 0}</td></tr>
                    <tr><td>评论发布失败</td><td>${review.comment_errors_count || 0}</td></tr>
                </table>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12">
                <h6>时间信息</h6>
                <table class="table table-sm">
                    <tr><td>创建时间</td><td>${new Date(review.created_at).toLocaleString('zh-CN')}</td></tr>
                    <tr><td>完成时间</td><td>${review.completed_at ? new Date(review.completed_at).toLocaleString('zh-CN') : '未完成'}</td></tr>
                    <tr><td>状态</td><td>
                        ${review.status === 'completed' ? '<span class="badge bg-success">已完成</span>' :
                          review.status === 'failed' ? '<span class="badge bg-danger">失败</span>' :
                          review.status === 'pending' ? '<span class="badge bg-primary">进行中</span>' :
                          '<span class="badge bg-secondary">已取消</span>'}
                    </td></tr>
                    ${review.error_message ? `<tr><td>错误信息</td><td class="text-danger">${review.error_message}</td></tr>` : ''}
                </table>
            </div>
        </div>

        ${issues.length > 0 ? `
        <div class="row mt-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="mb-0">
                        <i class="bi bi-bug"></i>
                        发现的问题 (${issues.length})
                    </h6>
                    ${pendingCount > 0 ? `
                        <button class="btn btn-sm btn-primary" onclick="confirmAllPending(${review.id}, event)">
                            <i class="bi bi-check-all"></i>
                            确认全部待审评论 (${pendingCount})
                        </button>
                    ` : ''}
                </div>

                <!-- 评论状态统计 -->
                <div class="mb-3">
                    <span class="badge bg-secondary me-2">待审: ${pendingCount}</span>
                    <span class="badge bg-success me-2">已确认: ${confirmedCount}</span>
                    <span class="badge bg-primary me-2">已发布: ${postedCount}</span>
                    <span class="badge bg-danger me-2">已拒绝: ${rejectedCount}</span>
                </div>

                <!-- 问题列表 -->
                <div class="table-responsive">
                    <table class="table table-hover table-sm">
                        <thead class="table-light">
                            <tr>
                                <th width="25%">文件位置</th>
                                <th width="10%">严重程度</th>
                                <th width="12%">类别</th>
                                <th width="38%">问题描述</th>
                                <th width="10%">状态</th>
                                <th width="5%">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${issues.map(issue => renderIssueRow(issue, review.id)).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        ` : '<div class="alert alert-info mt-3">此审查未发现任何问题</div>'}

        <div class="row mt-3">
            <div class="col-12">
                <h6>快速操作</h6>
                <div class="btn-group" role="group">
                    ${review.mr_url ? `
                        <button class="btn btn-primary" onclick="openMR('${review.mr_url}')">
                            <i class="bi bi-arrow-up-right-square"></i> 查看MR
                        </button>
                        <button class="btn btn-success" onclick="reviewAgain('${review.mr_url}')">
                            <i class="bi bi-arrow-clockwise"></i> 重新审查
                        </button>
                    ` : ''}
                </div>
            </div>
        </div>
    `;
}

function renderIssueRow(issue, reviewId) {
    const severityColors = {
        'error': 'danger',
        'warning': 'warning',
        'info': 'info'
    };
    const statusColors = {
        'pending': 'secondary',
        'confirmed': 'success',
        'posted': 'primary',
        'rejected': 'danger'
    };
    const statusLabels = {
        'pending': '待审',
        'confirmed': '已确认',
        'posted': '已发布',
        'rejected': '已拒绝'
    };

    const severityColor = severityColors[issue.severity] || 'secondary';
    const statusColor = statusColors[issue.comment_status] || 'secondary';
    const statusLabel = statusLabels[issue.comment_status] || issue.comment_status;

    return `
        <tr>
            <td>
                <small><strong>${issue.file_path}</strong></small><br>
                <small class="text-muted">行 ${issue.line_number}</small>
            </td>
            <td>
                <span class="badge bg-${severityColor}">${issue.severity}</span>
            </td>
            <td>
                <span class="badge bg-secondary">${issue.category || 'N/A'}</span>
            </td>
            <td>
                <small>${issue.message}</small>
                ${issue.suggestion ? `<br><small class="text-muted"><i class="bi bi-lightbulb"></i> ${issue.suggestion}</small>` : ''}
            </td>
            <td>
                <span class="badge bg-${statusColor}">${statusLabel}</span>
            </td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="showIssueDetail(${reviewId}, ${issue.id})" title="查看详情">
                    <i class="bi bi-eye"></i>
                </button>
            </td>
        </tr>
    `;
}

function openMR(mrUrl) {
    if (mrUrl) {
        window.open(mrUrl, '_blank');
    }
}

function reviewAgain(mrUrl) {
    if (mrUrl) {
        // 跳转到首页并填入MR URL
        window.location.href = `/?mr_url=${encodeURIComponent(mrUrl)}`;
    }
}

// 显示问题详情和代码上下文
async function showIssueDetail(reviewId, issueId) {
    const modal = new bootstrap.Modal(document.getElementById('codeContextModal'));
    const content = document.getElementById('codeContextContent');

    // 显示加载状态
    content.innerHTML = `
        <div class="text-center p-4">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2">正在加载代码上下文...</p>
        </div>
    `;
    modal.show();

    try {
        const response = await axios.get(`/api/review/${reviewId}/comment/${issueId}/context`);

        if (response.data.success) {
            const contextData = response.data.data;
            // 获取issue信息
            const issueResponse = await axios.get(`/api/history/review/${reviewId}`);
            const issues = issueResponse.data.data.issues || [];
            const issue = issues.find(i => i.id === issueId);

            content.innerHTML = renderCodeContext(contextData.context, issue);
        } else {
            content.innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-x-circle"></i>
                    加载失败：${response.data.error || '未知错误'}
                </div>
            `;
        }
    } catch (error) {
        console.error('Failed to load code context:', error);
        content.innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-x-circle"></i>
                加载失败：${error.response?.data?.error || error.message || '网络错误'}
            </div>
        `;
    }
}

// 渲染代码上下文
function renderCodeContext(context, issue) {
    if (!context) {
        return '<div class="alert alert-danger">无法加载代码上下文</div>';
    }

    // 合并所有行
    const allLines = [
        ...(context.lines_before || []),
        ...(context.target_deleted_lines || []),
        context.target_line,
        ...(context.lines_after || [])
    ].filter(line => line); // 过滤掉null/undefined

    return `
        <div class="mb-3">
            <h6><i class="bi bi-file-code"></i> ${context.file_path || 'N/A'}</h6>
            <p class="text-muted mb-2">第 ${context.target_line_number || 'N/A'} 行附近的代码</p>
        </div>

        <div class="code-context bg-light p-3 rounded" style="font-family: 'Courier New', monospace; font-size: 13px; overflow-x: auto;">
            ${allLines.map(line => {
                let bgClass = '';
                let icon = '';
                const isTarget = (line.line_number === context.target_line_number);

                if (line.is_deleted) {
                    bgClass = 'bg-danger bg-opacity-10 text-danger';
                    icon = '<i class="bi bi-dash-circle text-danger me-2"></i>';
                } else if (line.is_added) {
                    bgClass = 'bg-success bg-opacity-10 text-success';
                    icon = '<i class="bi bi-plus-circle text-success me-2"></i>';
                } else if (isTarget) {
                    bgClass = 'bg-warning bg-opacity-25';
                    icon = '<i class="bi bi-arrow-right-circle text-warning me-2"></i>';
                } else if (line.is_changed) {
                    bgClass = 'bg-info bg-opacity-10';
                    icon = '<i class="bi bi-pencil text-info me-2"></i>';
                }

                return `
                    <div class="code-line ${bgClass} py-1 px-2 mb-1" style="border-left: 3px solid ${isTarget ? '#ffc107' : 'transparent'};">
                        <span class="text-muted me-3" style="display: inline-block; width: 40px; text-align: right;">${line.line_number}</span>
                        ${icon}
                        <span style="white-space: pre-wrap;">${escapeHtml(line.content || '')}</span>
                    </div>
                `;
            }).join('')}
        </div>

        ${issue && issue.message ? `
        <div class="mt-3">
            <h6><i class="bi bi-exclamation-triangle"></i> 问题描述</h6>
            <div class="alert alert-warning mb-2">
                ${escapeHtml(issue.message)}
            </div>
        </div>
        ` : ''}

        ${issue && issue.suggestion ? `
        <div class="mt-2">
            <h6><i class="bi bi-lightbulb"></i> 修改建议</h6>
            <div class="alert alert-info mb-0">
                ${escapeHtml(issue.suggestion)}
            </div>
        </div>
        ` : ''}
    `;
}

// HTML转义函数
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 确认所有待审评论
async function confirmAllPending(reviewId, event) {
    if (!confirm('确定要确认并提交所有待审评论到GitLab吗？')) {
        return;
    }

    // 获取按钮（如果event存在）
    let btn = null;
    let originalHtml = '';
    if (event && event.target) {
        btn = event.target.closest('button');
        if (btn) {
            originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>提交中...';
        }
    }

    try {
        // 获取所有pending状态的评论ID
        const response = await axios.get(`/api/review/${reviewId}/pending-comments`);
        if (!response.data.success || !response.data.data || response.data.data.length === 0) {
            alert('没有待审评论需要确认');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
            return;
        }

        const pendingComments = response.data.data;
        const issueIds = pendingComments.map(c => c.id);

        // 批量确认评论
        const confirmResponse = await axios.post(`/api/review/${reviewId}/bulk-confirm`, {
            issue_ids: issueIds
        });

        if (confirmResponse.data.success) {
            alert(`成功提交 ${confirmResponse.data.data.confirmed_count} 条评论！`);

            // 重新加载详情
            const detailResponse = await axios.get(`/api/history/review/${reviewId}`);
            if (detailResponse.data.success) {
                renderReviewDetailModal(detailResponse.data.data);
            }

            // 刷新历史列表
            historyManager.loadReviews();
        } else {
            throw new Error(confirmResponse.data.error || '提交失败');
        }
    } catch (error) {
        console.error('Failed to confirm comments:', error);
        alert('提交评论失败：' + (error.response?.data?.error || error.message));

        // 恢复按钮状态
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    }
}
</script>
