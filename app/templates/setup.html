<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首次设置 - AutoCodeReview</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .setup-container {
            background: white;
            border: 1px solid #dee2e6;
            padding: 0;
            max-width: 520px;
            width: 100%;
            margin: 20px;
        }
        .setup-header {
            background: #0d6efd;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .setup-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .setup-header p {
            margin: 0;
            opacity: 0.95;
            font-size: 14px;
        }
        .setup-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .setup-body {
            padding: 35px;
        }
        .form-label {
            font-weight: 500;
            color: #495057;
            margin-bottom: 8px;
        }
        .form-control {
            border: 1px solid #ced4da;
            padding: 10px 14px;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: none;
            outline: 0;
        }
        .input-group-text {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-right: none;
        }
        .input-group .form-control {
            border-left: none;
        }
        .btn-setup {
            background: #0d6efd;
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
        }
        .btn-setup:hover {
            background: #0b5ed7;
            color: white;
        }
        .password-strength {
            height: 4px;
            background: #e9ecef;
            margin-top: 8px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            transition: all 0.3s;
            width: 0;
        }
        .strength-weak { background: #dc3545; width: 33%; }
        .strength-medium { background: #ffc107; width: 66%; }
        .strength-strong { background: #198754; width: 100%; }
        .form-text {
            font-size: 13px;
            margin-top: 6px;
        }
        .setup-footer {
            text-align: center;
            padding: 20px 35px 35px;
            border-top: 1px solid #e9ecef;
        }
        .setup-footer a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }
        .setup-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-header">
            <div class="setup-icon">
                <i class="bi bi-gear-fill"></i>
            </div>
            <h1>首次设置</h1>
            <p>欢迎使用 AutoCodeReview，请创建管理员账户</p>
        </div>

        <div class="setup-body">
            <div id="alertContainer"></div>

            <form id="setupForm">
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="bi bi-person-badge text-primary"></i>
                        管理员用户名
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="请输入用户名（3-50个字符）" required>
                    </div>
                    <small class="form-text text-muted">只能包含字母、数字、下划线和横线</small>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="bi bi-envelope text-primary"></i>
                        邮箱地址
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="admin@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="bi bi-shield-lock text-primary"></i>
                        密码
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="请输入密码（至少6位）" required>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <small class="form-text" id="strengthText">密码强度：-</small>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        <i class="bi bi-shield-check text-primary"></i>
                        确认密码
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" class="form-control" id="confirmPassword"
                               placeholder="请再次输入密码" required>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-setup btn-lg" id="submitBtn">
                        <i class="bi bi-check-circle"></i>
                        创建管理员账户
                    </button>
                </div>
            </form>
        </div>

        <div class="setup-footer">
            <small class="text-muted">
                已有账户？<a href="/login">立即登录</a>
            </small>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
    <script>
        // 密码强度检测
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');

            if (password.length === 0) {
                strengthBar.className = 'password-strength-bar';
                strengthText.textContent = '密码强度：-';
                strengthText.className = 'form-text';
                return;
            }

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            strengthBar.className = 'password-strength-bar';
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
                strengthText.textContent = '密码强度：弱';
                strengthText.className = 'form-text text-danger';
            } else if (strength <= 3) {
                strengthBar.classList.add('strength-medium');
                strengthText.textContent = '密码强度：中等';
                strengthText.className = 'form-text text-warning';
            } else {
                strengthBar.classList.add('strength-strong');
                strengthText.textContent = '密码强度：强';
                strengthText.className = 'form-text text-success';
            }
        });

        // 表单提交
        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 验证
            if (password !== confirmPassword) {
                showAlert('danger', '两次输入的密码不一致');
                return;
            }

            if (password.length < 6) {
                showAlert('danger', '密码至少需要6位');
                return;
            }

            // 禁用按钮
            const submitBtn = document.getElementById('submitBtn');
            const originalHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>创建中...';

            try {
                const response = await fetch('/api/initial-setup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('success', '管理员账户创建成功！正在跳转到登录页面...');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showAlert('danger', data.error || '创建失败，请重试');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalHtml;
                }
            } catch (error) {
                showAlert('danger', '网络错误：' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalHtml;
            }
        });

        function showAlert(type, message) {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show mb-3" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            document.getElementById('alertContainer').innerHTML = alertHtml;
        }

        // 页面加载时检查系统状态
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('/api/system-status');
                const data = await response.json();

                if (data.initialized) {
                    // 系统已初始化，检查用户是否登录
                    try {
                        const profileResponse = await fetch('/api/profile');
                        if (profileResponse.ok) {
                            // 用户已登录，跳转到首页
                            window.location.href = '/';
                        } else {
                            // 用户未登录，跳转到登录页
                            window.location.href = '/login';
                        }
                    } catch (error) {
                        // 获取用户信息失败，跳转到登录页
                        window.location.href = '/login';
                    }
                }
            } catch (error) {
                console.error('检查系统状态失败:', error);
            }
        });
    </script>
</body>
</html>
